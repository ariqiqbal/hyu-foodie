<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F5F2">
<meta name="description" content="HYU Foodie: halal, pork-free, vegan and Chinese food near Hanyang University ERICA, with student votes and an AI food bot.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HYU Foodie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* HYU Foodie v5 — simple modern look: warm white, one orange accent, deep green for halal, soft cards */
:root{
  --bg:#F6F5F2; --paper:#FFFFFF; --ink:#18181B; --muted:#77736C; --line:#ECEAE5; --chip:#EFEDE8;
  --brand:#F2662B; --brand-soft:#FFEFE6; --brand-ink:#B8461A;
  --halal:#0F7A5C; --halal-soft:#E3F3EC;
  --pork:#9A5B00; --pork-soft:#FFF2D9;
  --veg:#4C7A14; --veg-soft:#EDF5DE; --vegan:#3D6510;
  --red:#B4322A; --red-soft:#FCEAE7; --gold:#9C7000; --gold-soft:#FFF4D1; --naver:#03A94F;
  /* old names kept so older markup still works */
  --blue:var(--brand); --blue-soft:var(--brand-soft); --cream:var(--bg); --orange:var(--brand); --orange-soft:var(--brand-soft); --green:var(--veg); --green-soft:var(--veg-soft); --sky:var(--brand-soft);
  --display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --body:var(--display);
  --shadow:0 1px 2px rgba(24,24,27,.04),0 6px 20px rgba(24,24,27,.06); --shadow-sm:0 1px 2px rgba(24,24,27,.05);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px}
.app{max-width:460px;margin:0 auto;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.view{padding:8px max(18px,env(safe-area-inset-right,0px)) 24px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:28px;line-height:1.12;font-weight:800}
h2{font-size:18px;font-weight:800}
h3{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
.muted{color:var(--muted)} .small{font-size:12.5px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--brand-ink)}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrap{flex-wrap:wrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.card{background:var(--paper);border:0;border-radius:20px;box-shadow:var(--shadow)}
.pad{padding:16px}
.ok{color:var(--halal);font-weight:800}
/* top bars */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:6px;min-height:46px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--paper);display:grid;place-items:center;box-shadow:var(--shadow-sm);flex:none;color:var(--ink);text-decoration:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn[aria-pressed="true"]{color:var(--brand)}
.locpill{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border-radius:999px;padding:6px 14px 6px 6px;box-shadow:var(--shadow-sm);font-weight:700;font-size:13.5px}
.locpill i{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center}
.locpill i svg{width:16px;height:16px}
.locpill svg.cd{width:14px;height:14px;color:var(--muted)}
.hero-t p{margin-top:6px;color:var(--muted);font-size:14px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;font-weight:700;background:var(--chip);text-decoration:none;color:var(--ink);min-height:48px}
.btn:active{transform:scale(.98)}
.btn.primary,.btn.orange{background:var(--brand);color:#fff}
.btn.naver{background:var(--naver);color:#fff}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin:0 -18px;padding-inline:18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;padding:8px 15px;background:var(--paper);font-weight:600;font-size:13px;box-shadow:var(--shadow-sm);text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:5px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip svg{width:14px;height:14px}
.chip.pick{color:var(--gold);background:var(--gold-soft);box-shadow:none}
.chip.pick[aria-pressed="true"]{background:var(--gold);color:#fff}
/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;white-space:nowrap;border:0}
.badge svg{width:12px;height:12px}
.b-halal{background:var(--halal-soft);color:var(--halal)}
.b-pork{background:var(--pork-soft);color:var(--pork)}
.b-vegan{background:var(--veg-soft);color:var(--veg)}
.b-vg{background:var(--vegan);color:#fff}
.b-chinese{background:var(--red-soft);color:var(--red)}
.b-none{background:var(--chip);color:var(--muted)}
.b-gold,.b-pick{background:var(--gold-soft);color:var(--gold)}
.b-team{background:var(--halal);color:#fff}
/* search */
.search{display:flex;align-items:center;gap:10px;border:0;border-radius:16px;background:var(--paper);padding:0 16px;min-height:52px;box-shadow:var(--shadow-sm)}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:15px}
.search input::placeholder{color:#A19D95}
.search svg{width:19px;height:19px;flex:none;color:var(--muted)}
.hsearch{display:flex;gap:10px;align-items:center}
.hsearch .search{flex:1}
.sqbtn{width:52px;height:52px;border-radius:16px;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.sqbtn svg{width:20px;height:20px}
/* interface switch (4 options) */
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--chip);border-radius:16px;padding:4px;gap:2px}
.seg button{border:0;background:none;border-radius:12px;padding:10px 2px;font-weight:700;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.seg button svg{width:18px;height:18px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:0 2px 8px rgba(24,24,27,.18)}
/* category circles */
.cats{display:flex;gap:14px;overflow-x:auto;margin:0 -18px;padding:2px 18px 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;display:flex;flex-direction:column;align-items:center;gap:7px;width:66px;font-weight:600;font-size:12px;text-decoration:none;color:var(--ink);text-align:center}
.cat img,.cat .all{width:62px;height:62px;border-radius:50%;object-fit:cover;background:var(--paper);box-shadow:var(--shadow-sm)}
.cat .all{display:grid;place-items:center;color:var(--ink)}
.cat .all svg{width:22px;height:22px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:-6px}
.seeall{color:var(--brand-ink);font-weight:700;font-size:13px;text-decoration:none}
/* place cards */
.list{display:flex;flex-direction:column;gap:12px}
.pc{position:relative;display:flex;gap:14px;padding:10px;align-items:center;background:var(--paper);border-radius:20px;box-shadow:var(--shadow)}
.stretch{position:absolute;inset:0;border-radius:inherit;z-index:1}
.thumb{width:88px;height:88px;border-radius:14px;flex:none;overflow:hidden;display:grid;place-items:center;background:var(--chip)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .cu{font-weight:700;font-size:12px;text-align:center;padding:4px;color:var(--muted)}
.pinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pinfo h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ko{font-size:12px;font-weight:600;color:var(--muted)}
.meta{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.meta svg{width:13px;height:13px}
.vt{display:inline-flex;align-items:center;gap:3px;color:var(--ink);font-weight:700}
.vt svg{color:var(--brand)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.heart{position:relative;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:var(--paper);display:grid;place-items:center;color:var(--ink);flex:none;align-self:flex-start;box-shadow:var(--shadow-sm)}
.heart svg{width:18px;height:18px}
.heart[aria-pressed="true"]{color:var(--brand)}
.hscroll{display:flex;gap:14px;overflow-x:auto;margin:0 -18px;padding:2px 18px 10px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.vc{position:relative;flex:none;width:228px;background:var(--paper);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.vc .ph{height:142px;background:var(--chip);overflow:hidden;margin:8px 8px 0;border-radius:15px}
.vc .ph img{width:100%;height:100%;object-fit:cover}
.vc .heart{position:absolute;top:16px;right:16px;width:34px;height:34px}
.vc .bd{padding:10px 14px 14px;display:flex;flex-direction:column;gap:3px}
.vc h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:6px;border-radius:6px;background:var(--gold-soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--gold);border-radius:6px}
/* info cards */
.explain{display:flex;flex-direction:column;gap:10px;border-radius:20px;padding:18px}
.explain p{line-height:1.6}
.explain.t-halal{background:var(--halal-soft);box-shadow:none}
.explain.t-veg{background:var(--veg-soft);box-shadow:none}
.explain.t-mart{background:var(--pork-soft);box-shadow:none}
.explain .ehead{display:flex;align-items:center;gap:10px}
.explain .ehead i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--paper)}
.explain .ehead i svg{width:18px;height:18px}
.legend{display:flex;flex-direction:column;gap:8px;background:var(--paper);border-radius:14px;padding:12px}
.legend div{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px;align-items:center;font-size:12px}
.note{background:var(--paper);border-radius:14px;padding:12px 14px;font-size:12px;color:var(--muted);box-shadow:none;border:1px solid var(--line)}
.note.tip{background:var(--brand-soft);border-color:transparent;color:var(--brand-ink);font-weight:600}
/* detail */
.dwrap{margin:-8px -18px 0;position:relative}
.dhero{position:relative;aspect-ratio:4/3.2;background:var(--chip);overflow:hidden}
.dhero img{width:100%;height:100%;object-fit:cover;display:block}
.dhero .cu{font-weight:800;font-size:26px;display:grid;place-items:center;height:100%;color:var(--muted)}
.dbar{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;z-index:2}
.dbar .iconbtn{background:rgba(255,255,255,.94)}
.dphoto{position:absolute;left:16px;bottom:34px;background:rgba(24,24,27,.6);color:#fff;font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;backdrop-filter:blur(6px)}
.sheet{background:var(--bg);border-radius:26px 26px 0 0;margin:-42px -18px 0;position:relative;padding:22px 18px 0;display:flex;flex-direction:column;gap:16px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);border-radius:18px;box-shadow:var(--shadow-sm)}
.facts div{padding:12px 6px;text-align:center;display:flex;flex-direction:column;gap:2px}
.facts div+div{border-left:1px solid var(--line)}
.facts b{font-size:15px} .facts span{font-size:11.5px;color:var(--muted)}
.info{display:flex;flex-direction:column;margin:0}
.info div{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.info div:last-child{border-bottom:0}
.info dt{color:var(--muted);font-weight:600} .info dd{margin:0;font-weight:600}
.dish{display:flex;align-items:center;gap:12px;padding:9px 0}
.num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none;background:var(--chip)}
.num.gold{background:var(--brand);color:#fff}
.vote{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vote .btn{background:var(--chip);padding:12px 8px;font-size:14px;white-space:nowrap}
.vote .yes[aria-pressed="true"]{background:var(--gold);color:#fff}
.vote .no[aria-pressed="true"]{background:var(--ink);color:#fff}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mode{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:16px;background:var(--bg);text-decoration:none;color:var(--ink);font-weight:700;font-size:12px}
.mascot{width:46px;height:46px;border-radius:50%;background:var(--paper);display:grid;place-items:center;color:var(--brand)}
.mascot svg{width:22px;height:22px}
.pill-dark{background:var(--ink);color:#fff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700}
/* chat */
.bubble{max-width:86%;padding:11px 15px;border-radius:20px;background:var(--paper);box-shadow:var(--shadow-sm);white-space:pre-wrap}
.bubble.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:6px}
.bubble.bot{border-bottom-left-radius:6px}
.composer{display:flex;gap:8px}
.composer input,.field{flex:1;min-width:0;border:0;border-radius:16px;padding:14px 16px;background:var(--paper);box-shadow:var(--shadow-sm);outline:0}
textarea.field{min-height:96px;resize:vertical;width:100%}
select.field{appearance:auto}
.steps{display:flex;flex-direction:column}
.step{border-top:1px solid var(--line);padding:12px 0;display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px}
.step b{font-size:30px;line-height:1;color:var(--brand)}
.check{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--gold);background:var(--gold-soft)}
.dot svg{width:12px;height:12px}
.spin{width:12px;height:12px;border:2px solid var(--brand);border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-weight:600;font-size:13px;z-index:40;max-width:calc(100% - 32px);text-align:center}
.empty{text-align:center;padding:26px 18px;display:flex;flex-direction:column;gap:8px;align-items:center}
.melist{display:flex;flex-direction:column}
.melist a,.melist div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;font-weight:600}
.melist>:last-child{border-bottom:0}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);box-shadow:0 -1px 0 var(--line);padding:8px max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabbar nav{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#9A968E;text-decoration:none;padding:2px 0}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--ink);font-weight:800}
.tab[aria-current="page"]::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--brand);margin-top:1px}
.tab.ai .ic{width:50px;height:50px;border-radius:50%;background:var(--brand);display:grid;place-items:center;color:#fff;margin-top:-24px;box-shadow:0 6px 16px rgba(242,102,43,.35)}
.tab.ai{color:var(--brand-ink)}
.tab.ai[aria-current="page"] .ic{background:var(--ink);box-shadow:0 6px 16px rgba(24,24,27,.3)}
.tab.ai[aria-current="page"]::after{display:none}
/* Kakao map markers (map view kept in code) */
.kdot{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);padding:0;display:block}
.kdot.on{width:26px;height:26px;box-shadow:0 0 0 3px var(--brand)}
.kgate{background:var(--ink);color:#fff;font-weight:800;font-size:11px;padding:3px 9px;border-radius:999px;border:2px solid #fff}

/* v6 floating style: deeper soft shadows, round plates, floating tab bar, photo banner */
:root{--shadow:0 12px 30px rgba(70,40,10,.10),0 2px 6px rgba(70,40,10,.05);--shadow-sm:0 4px 14px rgba(70,40,10,.08);--grad:linear-gradient(135deg,#F7A23B 0%,#F2662B 100%)}
.app{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
.tabbar{left:0;right:0;bottom:0;background:none;box-shadow:none;backdrop-filter:none;padding:0 14px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabbar nav{pointer-events:auto;max-width:432px;background:#fff;border-radius:28px;padding:10px 8px 8px;box-shadow:0 14px 34px rgba(70,40,10,.16),0 2px 6px rgba(70,40,10,.06)}
.tab[aria-current="page"]{color:var(--brand)}
.tab.ai .ic{background:var(--grad);margin-top:-30px;border:4px solid var(--bg);width:58px;height:58px}
.seg{background:#fff;box-shadow:var(--shadow-sm)}
.seg button[aria-pressed="true"]{background:var(--grad);color:#fff;box-shadow:0 6px 14px rgba(242,102,43,.30)}
.chip[aria-pressed="true"]{background:var(--brand)}
.sqbtn{background:var(--grad);box-shadow:0 8px 18px rgba(242,102,43,.30)}
.cat img,.cat .all{border:3px solid #fff;box-shadow:var(--shadow-sm);width:64px;height:64px}
.pc{border-radius:24px;padding:12px}
.pc .thumb{width:86px;height:86px;border-radius:50%;box-shadow:0 8px 18px rgba(70,40,10,.18)}
.heart{box-shadow:var(--shadow-sm)}
.banner{position:relative;border-radius:24px;overflow:hidden;min-height:158px;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:20px 140px 20px 20px;color:#fff;background:#2B1A10;box-shadow:var(--shadow);text-decoration:none}
.banner img{position:absolute;right:-30px;top:50%;transform:translateY(-50%);width:200px;height:200px;object-fit:cover;border-radius:50%;box-shadow:0 0 0 6px rgba(255,255,255,.08)}
.banner::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#2B1A10 45%,rgba(43,26,16,0) 75%);z-index:1}
.banner>*:not(img){position:relative;z-index:2}
.banner h2{color:#fff;font-size:21px;line-height:1.15}
.banner p{font-size:12.5px;color:#F2E6DC}
.banner .cta{align-self:flex-start;background:#fff;color:var(--brand-ink);font-weight:800;font-size:12.5px;border-radius:999px;padding:7px 14px;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gc{position:relative;background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:8px 8px 14px;display:flex;flex-direction:column;gap:3px}
.gc .ph{aspect-ratio:1/0.82;border-radius:16px;overflow:hidden;background:var(--chip);margin-bottom:6px}
.gc .ph img{width:100%;height:100%;object-fit:cover}
.gc h3{font-size:14px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc .meta{padding:0 4px;font-size:12px}
.gc .tags{padding:0 4px}
.gc .heart{position:absolute;right:-6px;bottom:-10px;width:40px;height:40px;background:var(--grad);color:#fff;border:4px solid var(--bg)}
.gc .heart[aria-pressed="true"]{background:var(--ink);color:#fff}
.profile{margin:-8px -18px 0;background:var(--grad);border-radius:0 0 32px 32px;padding:22px 18px 58px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.profile .av{width:76px;height:76px;border-radius:50%;background:#fff;color:var(--brand);display:grid;place-items:center;box-shadow:0 10px 24px rgba(0,0,0,.15)}
.profile .av svg{width:36px;height:36px}
.profile h1{color:#fff;font-size:24px}
.profile p{font-size:12.5px;opacity:.9}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:-52px;position:relative}
.stats a,.stats div{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:12px 6px;text-align:center;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.stats b{font-size:19px;color:var(--brand)} .stats span{font-size:11.5px;color:var(--muted);font-weight:600}
.dhero{border-radius:0 0 0 0}
.bubble.me{background:var(--grad)}
</style>
</head>
<body>

<div class="app">
  <main id="view" class="view" aria-live="polite"></main>
</div>
<div class="tabbar"><nav id="tabs" aria-label="Main"></nav></div>
<div id="toast" class="toast" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// ---------- data: places.json (Kakao Map + HESS Food Guide for Muslims) ----------
let PLACES=[],PMAP=new Map(),MARTS=[];
const DIET={halal:["Halal certified","b-halal","shield"],porkfree:["Pork-free options","b-pork","info"],halalc:["Maybe halal · check","b-gold","info"],veganc:["Not checked","b-none","info"],chinese:["Chinese","b-chinese","bowl"],none:["Not checked","b-none","info"]};
// Vegetarian / vegan labels. "vg" = vegan (no animal products), "v" = vegetarian (may have egg or dairy). Not verified: staff check needed.
const VEG={rayhon:["vg","Vegan dish: Falafel"],pizzaschool:["v","Vegetarian dish: Cheese Pizza"]};
function vegOf(p){if(VEG[p.id])return VEG[p.id];if(p.diet==="veganc"||p.group==="Salad")return ["vg","Vegan options · check"];return null;}
function vegBadge(p){const v=vegOf(p);return v?`<span class="badge ${v[0]==="vg"?"b-vg":"b-vegan"}">${ic("leaf")}${v[1]}</span>`:"";}
const MODES={general:["General","All restaurants","hansang"],halal:["Halal","Halal & pork-free","kebab"],veg:["Vegetarian","Vegetarian & vegan","vegan"],mart:["Mart","Halal groceries","grocery"]};
const MFILTERS={general:[["all","All"],["pick","ERICA Pick"],["Korean","Korean"],["Cafe","Cafe"],["chinese","Chinese"],["Japanese","Japanese"],["Chicken","Chicken"],["Western","Western"],["Korean street food","Street food"],["Snacks & dessert","Dessert"],["Asian","Asian"]],halal:[["all","All"],["pick","ERICA Pick"],["halal","Halal certified"],["porkfree","Pork-free options"]],veg:[["all","All"],["pick","ERICA Pick"]],mart:[["all","All"]]};
function modeMatch(p){if(S.mode==="halal")return ["halal","halalc","porkfree"].includes(p.diet);if(S.mode==="veg")return !!vegOf(p);if(S.mode==="mart")return false;return true;}
function setMode(m){S.mode=m;S.filter="all";S.limit=30;try{localStorage.setItem("hyu-mode",m);}catch(e){}render();}
function match(p,f){if(f==="all")return true;if(f==="pick")return tally(p.id).t>0;if(f==="halal")return p.diet==="halal"||p.diet==="halalc";if(f==="porkfree")return p.diet==="porkfree";if(f==="chinese")return p.diet==="chinese";return p.group===f;}
const distTxt=p=>p.m!=null?`${p.m} m · ${p.w} min walk`:"near ERICA";
const PICK_MIN=20, PICK_PCT=0.7;

// ---------- icons ----------
const I={home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',compass:'<circle cx="12" cy="12" r="10"/><path d="m16.2 7.8-2.1 6.3-6.3 2.1 2.1-6.3z"/>',spark:'<path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z"/><path d="M19 3v4M21 5h-4"/>',bookmark:'<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',map:'<path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/>',search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',back:'<path d="m15 18-6-6 6-6"/>',shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',leaf:'<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10z"/><path d="M2 21c0-3 1.9-5.4 5.1-6C9.5 14.5 12 13 13 12"/>',bowl:'<path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M7 7c1-2 3-2 4 0s3 2 4 0"/>',bag:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/>',link:'<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',award:'<circle cx="12" cy="8" r="6"/><path d="M15.5 12.9 17 22l-5-3-5 3 1.5-9.1"/>',up:'<path d="M7 10v12M15 5.9 14 10h5.8a2 2 0 0 1 1.9 2.6l-2.3 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.8a2 2 0 0 0 1.8-1.1L12 2a3.1 3.1 0 0 1 3 3.9Z"/>',down:'<path d="M17 14V2M9 18.1 10 14H4.2a2 2 0 0 1-1.9-2.6l2.3-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.8a2 2 0 0 0-1.8 1.1L12 22a3.1 3.1 0 0 1-3-3.9Z"/>',nav:'<path d="m3 11 19-9-9 19-2-8z"/>',copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',walk:'<circle cx="13" cy="4" r="2"/><path d="m9 20 3-6 3 2v6M7 12l3-4 4 1 3 3M10 8l-2 6"/>',bus:'<rect x="4" y="3" width="16" height="15" rx="2"/><path d="M4 11h16M8 21v-3M16 21v-3"/>',car:'<path d="M5 17h14v-5l-2-5H7l-2 5z"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/>',send:'<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',check:'<path d="M20 6 9 17l-5-5"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',camera:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>',heart:'<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"/>',pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>',chevD:'<path d="m6 9 6 6 6-6"/>',chevR:'<path d="m9 18 6-6-6-6"/>',bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',filter:'<path d="M3 6h18M7 12h10M10 18h4"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'};
const ic=(n,fill)=>`<svg viewBox="0 0 24 24" fill="${fill?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const byId=id=>PMAP.get(id);
const naverUrl=p=>"https://map.naver.com/p/search/"+encodeURIComponent((p.ko||p.name)+" "+p.address);
const kakaoUrl=p=>p.k?"https://place.map.kakao.com/"+p.k:"https://map.kakao.com/?q="+encodeURIComponent(p.ko||p.name);

// ---------- state ----------
const CFG=window.HYU_CONFIG||{};
const S={mode:(()=>{try{const m=localStorage.getItem("hyu-mode");return ["general","halal","veg","mart"].includes(m)?m:"general";}catch(e){return "general";}})(),sb:null,uid:null,online:false,totals:{},my:{},votesLoaded:false,saved:new Set(),filter:"all",q:"",sort:"top",limit:30,zoom:1,mapView:(CFG.KAKAO_JS_KEY?"kakao":"real"),chat:[],botBusy:false,imp:null,impImg:null,impImgUrl:null,mapSel:null,canVote:true,aiOff:false};
function tally(id){const v=S.totals[id]||[0,0];const y=v[0],n=v[1],t=y+n;return {y,n,t,pct:t?y/t:0,pick:t>=PICK_MIN&&y/t>=PICK_PCT&&y>n};}
const myVote=id=>S.my[id]||0;
function score(p){const t=tally(p.id);return (t.pick?1000:0)+t.y*3-t.n*2+({halal:40,porkfree:20,halalc:10}[p.diet]||0)-(p.m??900)/100;}

// ---------- backend: places.json + Supabase (votes, saved) + /api (AI) ----------
async function boot(){
  render();
  try{const r=await fetch("places.json");PLACES=await r.json();PMAP=new Map(PLACES.map(p=>[p.id,p]));}catch(e){toast("Could not load places. Check your connection.");}
  try{const r=await fetch("marts.json");if(r.ok)MARTS=await r.json();}catch(e){}
  loadLocalSaved();render();
  if(!CFG.SUPABASE_URL||!CFG.SUPABASE_ANON_KEY)S.dbError="config.js has no Supabase URL or key";
  else if(!window.supabase)S.dbError="the Supabase library did not load (network or ad blocker)";
  if(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&window.supabase){
    try{
      S.sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
      let {data:{session}}=await S.sb.auth.getSession();
      if(!session){const r=await S.sb.auth.signInAnonymously();if(r.error)throw r.error;session=r.data.session;}
      S.uid=session.user.id;S.online=true;
      await Promise.all([loadTotals(),loadMine(),syncSaved()]);
      setInterval(()=>{if(document.visibilityState==="visible")loadTotals().then(softRender);},60000);
    }catch(e){console.warn("Supabase not ready:",e);S.online=false;S.dbError=(e&&(e.message||e.error_description||e.code))||String(e);}
  }
  render();
}
async function loadTotals(){if(!S.sb)return;const {data,error}=await S.sb.from("vote_totals").select("place_id,yes,no");if(error){S.votesLoaded="error";return;}const t={};for(const r of data||[])t[r.place_id]=[Number(r.yes)||0,Number(r.no)||0];S.totals=t;S.votesLoaded=true;}
async function loadMine(){const {data}=await S.sb.from("votes").select("place_id,value");const m={};(data||[]).forEach(r=>m[r.place_id]=r.value);S.my=m;}
async function syncSaved(){const {data,error}=await S.sb.from("saved").select("place_id");if(error)return;const server=new Set((data||[]).map(r=>r.place_id));const local=[...S.saved].filter(id=>!server.has(id));if(local.length)await S.sb.from("saved").upsert(local.map(place_id=>({user_id:S.uid,place_id})),{onConflict:"user_id,place_id"});local.forEach(id=>server.add(id));S.saved=new Set([...server].filter(byId));saveLocal();}
function loadLocalSaved(){try{const v=JSON.parse(localStorage.getItem("hyu-saved")||"[]");if(Array.isArray(v))v.forEach(x=>byId(x)&&S.saved.add(x));}catch(e){}}
function saveLocal(){try{localStorage.setItem("hyu-saved",JSON.stringify([...S.saved]));}catch(e){}}
function persistSaved(){saveLocal();if(S.sb&&S.uid){const rows=[...S.saved].map(place_id=>({user_id:S.uid,place_id}));if(rows.length)S.sb.from("saved").upsert(rows,{onConflict:"user_id,place_id"}).then(()=>{});}}
async function toggleSave(id){
  const on=!S.saved.has(id);if(on)S.saved.add(id);else S.saved.delete(id);saveLocal();toast(on?"Saved":"Removed from Saved");render();
  if(S.sb&&S.uid){const q=on?S.sb.from("saved").upsert({user_id:S.uid,place_id:id},{onConflict:"user_id,place_id"}):S.sb.from("saved").delete().eq("user_id",S.uid).eq("place_id",id);const {error}=await q;if(error)toast("Saved on this phone only.");}
}
let voting=false;
async function vote(id,val){
  if(!S.sb||!S.uid){toast("Voting is not connected: "+(S.dbError||"unknown reason"));return;}
  if(voting)return;voting=true;
  const prev=S.my[id]||0,next=prev===val?0:val;
  const t=S.totals[id]?[...S.totals[id]]:[0,0];if(prev===1)t[0]--;if(prev===-1)t[1]--;if(next===1)t[0]++;if(next===-1)t[1]++;S.totals[id]=t;if(next)S.my[id]=next;else delete S.my[id];render();
  try{
    const q=next?S.sb.from("votes").upsert({user_id:S.uid,place_id:id,value:next,updated_at:new Date().toISOString()},{onConflict:"user_id,place_id"}):S.sb.from("votes").delete().eq("user_id",S.uid).eq("place_id",id);
    const {error}=await q;if(error)throw error;
    toast(next===1?"Thanks! You said Worth it.":next===-1?"Thanks for the honest vote.":"Vote removed");loadTotals().then(softRender);
  }catch(e){if(prev)S.my[id]=prev;else delete S.my[id];await loadTotals();render();toast("Vote not saved. Check your connection.");}
  finally{voting=false;}
}
async function api(path,body){const r=await fetch(path,body?{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)}:{});let j=null;try{j=await r.json();}catch(e){}if(!r.ok)throw {code:(j&&j.error)||("http_"+r.status)};return j;}

// ---------- UI pieces ----------
function badge(d){const [l,c,i]=DIET[d];return `<span class="badge ${c}">${ic(i)}${l}</span>`;}
function survBadge(p){return p.surveyed?`<span class="badge b-team">${ic("check")}Checked by team</span>`:"";}
function pickBadge(t){return t.pick?`<span class="badge b-pick">${ic("award")}ERICA Pick · ${Math.round(t.pct*100)}%</span>`:"";}
const picSrc=p=>p.photo?p.photo:(p.img?`img/${p.img}.webp`:"");
function thumb(p,cls="thumb"){return `<div class="${cls}">${picSrc(p)?`<img src="${picSrc(p)}" alt="" loading="lazy">`:`<span class="cu">${esc(p.cuisine)}</span>`}</div>`;}
function voteLine(p){const t=tally(p.id);if(!t.t)return "";return `<span class="vt">${ic("up")}${Math.round(t.pct*100)}%</span><span>(${t.t})</span>`;}
function heartBtn(id){const on=S.saved.has(id);return `<button class="heart" aria-pressed="${on}" aria-label="${on?"Remove from saved":"Save"}" onclick="event.preventDefault();event.stopPropagation();toggleSave('${id}')">${ic("heart",on)}</button>`;}
const dot='<span aria-hidden="true">·</span>';
function pcard(p){return `<article class="pc"><a class="stretch" href="#p-${p.id}" aria-label="${esc(p.name)}"></a>${thumb(p)}<div class="pinfo"><h3>${esc(p.name)}</h3>${p.ko&&p.ko!==p.name?`<span class="ko">${esc(p.ko)}</span>`:""}<div class="meta">${esc(p.cuisine)}${dot}${p.m!=null?p.m+" m":"near"}${tally(p.id).t?dot+voteLine(p):""}</div><div class="tags">${badge(p.diet)}${vegBadge(p)}${pickBadge(tally(p.id))}${survBadge(p)}</div></div>${heartBtn(p.id)}</article>`;}
function vcard(p){return `<article class="vc"><a class="stretch" href="#p-${p.id}" aria-label="${esc(p.name)}"></a><div class="ph">${picSrc(p)?`<img src="${picSrc(p)}" alt="" loading="lazy">`:""}</div>${heartBtn(p.id)}<div class="bd"><h3>${esc(p.name)}</h3><div class="meta">${esc(p.cuisine)}${dot}${p.m!=null?p.m+" m":"near"}</div>${tally(p.id).t?`<div class="meta">${voteLine(p)}</div>`:""}<div class="tags">${badge(p.diet)}${vegBadge(p)}</div></div></article>`;}
function topbar(title,right=""){return `<div class="topbar"><a class="iconbtn" href="#home" onclick="if(history.length>1){history.back();return false}" aria-label="Back">${ic("back")}</a><h2 style="font-size:18px;flex:1;text-align:center">${esc(title)}</h2>${right||'<span style="width:42px"></span>'}</div>`;}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2400);}
function sorted(list){return [...list].sort((a,b)=>score(b)-score(a));}

// ---------- views ----------
const MICON={general:"bowl",halal:"shield",veg:"leaf",mart:"bag"};
function modePicker(){return `<div class="seg" role="group" aria-label="Choose your interface">${Object.entries(MODES).map(([k,[l]])=>`<button aria-pressed="${S.mode===k}" onclick="setMode('${k}')">${ic(MICON[k])}${k==="veg"?"Veggie":l}</button>`).join("")}</div>`;}
function cat(l,f,img){return `<a class="cat" href="#explore" onclick="S.filter='${f}';S.limit=30;S.sort='top'">${img?`<img src="img/${img}.webp" alt="">`:`<span class="all">${ic("grid")}</span>`}${l}</a>`;}
function seeAll(f,sort){return `<a href="#explore" onclick="S.filter='${f}';S.sort='${sort||"top"}';S.limit=30" class="seeall">See all</a>`;}
function sechead(t,link){return `<div class="sechead"><h2>${t}</h2>${link||""}</div>`;}
function hchips(){
  const C={general:[["Korean","Korean","hansang"],["Cafe","Cafe","coffee"],["chinese","Chinese","jjajang"],["Japanese","Japanese","japanese"],["Chicken","Chicken","chicken"],["Western","Western","pasta"],["Korean street food","Street food","bunsik"],["Snacks & dessert","Dessert","dessert"]],halal:[["halal","Halal","kebab"],["porkfree","Pork-free","chicken"],["pick","ERICA Pick","indian"]],veg:[],mart:[]}[S.mode]||[];
  if(!C.length)return "";return `<div class="cats" role="group" aria-label="Categories">${C.map(([f,l,img])=>cat(l,f,img)).join("")}${cat("All","all")}</div>`;}
function banner(){
  const B={general:["Hungry between classes?","Tell Foodie AI your mood. It picks a place for you.","Ask AI","#bot","img/hansang.webp"],
    halal:["Halal food near ERICA","Places checked by the HESS Food Guide, plus pork-free options.","See all","#explore","img/kebab.webp"],
    veg:["Plant-based picks","Vegetarian and vegan dishes near campus.","See all","#explore","img/vegan.webp"],
    mart:["Halal groceries nearby","Chicken, meat, sausage and instant noodles.","See marts","#marts",(MARTS[0]&&MARTS[0].photo)||"img/grocery.webp"]}[S.mode];
  return `<a class="banner" href="${B[3]}" ${B[3]==="#explore"?`onclick="S.filter='all';S.limit=30"`:""}><img src="${B[4]}" alt=""><h2>${B[0]}</h2><p>${B[1]}</p><span class="cta">${B[2]}</span></a>`;}
function gcard(p){return `<article class="gc"><a class="stretch" href="#p-${p.id}" aria-label="${esc(p.name)}"></a><div class="ph">${picSrc(p)?`<img src="${picSrc(p)}" alt="" loading="lazy">`:""}</div><h3>${esc(p.name)}</h3><div class="meta">${esc(p.cuisine)}${dot}${p.m!=null?p.m+" m":"near"}</div>${tally(p.id).t?`<div class="meta">${voteLine(p)}</div>`:""}<div class="tags">${badge(p.diet)}</div>${heartBtn(p.id)}</article>`;}
function homeTop(){
  return `
  <div class="topbar"><span class="locpill"><i>${ic("pin")}</i>Hanyang Univ. ERICA</span><div class="row" style="gap:8px"><a class="iconbtn" href="#explore" aria-label="Search">${ic("search")}</a><a class="iconbtn" href="#saved" aria-label="Saved places">${ic("heart")}</a></div></div>
  <div class="hero-t"><h1>What do you feel<br>like eating today?</h1><p>Hello, ERICA. Food within a 7-minute walk.</p></div>
  <div class="hsearch"><form class="search" onsubmit="event.preventDefault();S.q=this.q.value;S.limit=30;location.hash='explore'"><label class="sr" for="q">Search</label>${ic("search")}<input id="q" name="q" placeholder="Search food or restaurant, 한글 OK" autocomplete="off"></form><a class="sqbtn" href="#explore" aria-label="Filters">${ic("filter")}</a></div>
  ${modePicker()}
  ${banner()}
  ${hchips()}
`;}
function vHome(){
  if(S.mode==="mart")return homeTop()+`
  <section class="card explain t-mart"><div class="ehead"><i style="color:var(--pork)">${ic("bag")}</i><h2>Halal groceries</h2></div>
    <p>These shops sell imported halal food: chicken, meat, sausage, ramen and instant noodles.</p>
    <p class="muted small">The shops are not halal certified. Only some products are. Look for the halal logo on each pack.</p></section>
  ${sechead("Halal marts nearby")}
  <div class="list">${MARTS.map(mcard).join("")||`<div class="card empty"><h3>Coming soon</h3></div>`}</div>`;
  const inMode=sorted(PLACES.filter(modeMatch));
  let info="",title="Popular near ERICA",extra="";
  if(S.mode==="halal"){
    title="Halal near ERICA";
    info=`<section class="card explain t-halal"><div class="ehead"><i style="color:var(--halal)">${ic("shield")}</i><h2>What is halal?</h2></div>
      <p>Halal means anything that is permissible or allowed in Islam. For food to be halal, it must contain permissible ingredients, be free from prohibited substances such as pork and alcohol, and follow Islamic guidelines in its preparation. Halal slaughtering also emphasizes cleanliness, kindness, and minimizing the animal's suffering, making it a more compassionate way of slaughtering animals.</p>

  ${list.length?`<div class="list">${list.map(pcard).join("")}</div>`:`<div class="card empty"><span class="mascot">${ic("heart")}</span><h3>Nothing saved yet</h3><p class="small muted">Tap the heart on a restaurant to keep it here.</p><a class="btn primary" href="#explore">Find food</a></div>`}
  ${S.online?"":`<p class="small muted">Saved places stay on this phone.</p>`}`;
}

// ---------- AI bot ----------
const MOODS=["Tired, want comfort food","Something spicy","Light and cheap","Craving meat","Quick snack between classes"];
function vBot(){
  return `<div class="topbar"><div class="row"><span class="iconbtn" style="background:var(--grad);color:#fff">${ic("spark")}</span><div><h2>Foodie AI</h2><span class="small muted">${S.aiOff?"Simple mode: AI is not set up yet":"Picks from "+PLACES.length+" places near ERICA"}</span></div></div></div>
  <div style="display:flex;flex-direction:column;gap:10px" id="chat">
    <div class="bubble bot">Hi! How are you feeling? Tell me your mood, hunger or budget and I will pick a place near ERICA.</div>
    <div class="chips" style="flex-wrap:wrap">${MOODS.map(m=>`<button class="chip" onclick="askBot(this.textContent)">${m}</button>`).join("")}</div>
    ${S.chat.map(chatHtml).join("")}
  </div>
  <form class="composer" onsubmit="event.preventDefault();const v=this.m.value.trim();if(v){askBot(v);this.m.value=''}"><label class="sr" for="m">Message</label><input id="m" name="m" placeholder="How do you feel today?" autocomplete="off" ${S.botBusy?"disabled":""}><button class="iconbtn" style="width:52px;height:52px;background:var(--grad);color:#fff" aria-label="Send" ${S.botBusy?"disabled":""}>${ic("send")}</button></form>`;
}
function chatHtml(m){
  if(m.role==="user")return `<div class="bubble me">${esc(m.text)}</div>`;
  const picks=(m.picks||[]).map(x=>({p:byId(x.id),why:x.why})).filter(x=>x.p);
  return `<div class="bubble bot">${esc(m.text)}</div>${picks.map(({p,why})=>`<div>${pcard(p)}<p class="small" style="margin:6px 4px 0;font-weight:600">Why: ${esc(why)}</p></div>`).join("")}`;
}
function placeBrief(){return PLACES.map(p=>{const t=tally(p.id);return `${p.id}|${p.name}${p.ko&&p.ko!==p.name?" ("+p.ko+")":""}|${p.cuisine}|${DIET[p.diet][0]}|${p.m??"?"}m${(p.dishes||[]).length?"|dishes: "+p.dishes.join(", "):""}${p.note?"|tip: "+p.note:""}${t.t?"|votes "+t.y+"/"+t.t:""}`;}).join("\n");}
function fallbackPicks(text){
  const t=text.toLowerCase();const rules=[[/spic|hot|chili/,["zaika","ilmi","alchon"]],[/meat|lamb|kebab|hungry|craving/,["saray","rayhon","thechicken"]],[/cheap|light|snack|quick|between/,["gimbapq","isaac","subway"]],[/comfort|tired|cold|warm|soup/,["zaika","tamna","saray"]],[/curry|indian/,["zaika"]]];
  for(const [re,ids] of rules)if(re.test(t)){const ok=ids.filter(byId);if(ok.length)return ok;}return ["saray","zaika","rayhon"].filter(byId);
}
async function askBot(text){
  if(S.botBusy)return;S.chat.push({role:"user",text});S.botBusy=true;S.chat.push({role:"bot",text:"Thinking..."});render();
  const slot=S.chat[S.chat.length-1];
  try{
    const out=await api("/api/ai",{task:"bot",message:text,votes:S.totals});
    slot.text=String(out&&out.reply||"Here are my picks.");slot.picks=Array.isArray(out&&out.picks)?out.picks.filter(x=>x&&byId(String(x.id))).map(x=>({id:String(x.id),why:String(x.why||"")})).slice(0,3):[];
    if(!slot.picks.length){slot.picks=fallbackPicks(text).map(id=>({id,why:"Good match for what you asked."}));}
  }catch(e){
    if(e&&e.code==="ai_not_configured")S.aiOff=true;
    slot.text=(e&&e.code==="rate_limited")?"Too many questions right now. Here are quick picks:":"Here are quick picks for you:";
    slot.picks=fallbackPicks(text).map(id=>({id,why:((byId(id).dishes||[])[0]||byId(id).cuisine)+" is popular here."}));
  }finally{S.botBusy=false;render();const c=document.getElementById("m");if(c)c.focus();}
}

// ---------- import from social ----------
const EXAMPLE="Best halal curry near ERICA 🔥 cheese naan is crazy! 2F, Hanyangdaehak-ro. Also tried the lamb box kebab next door #ansan #halal";
function vImport(){
  const r=S.imp||{};
  return `${topbar("Import from social")}
  <div style="display:flex;flex-direction:column;gap:8px"><h1>Save it from anywhere. We'll find where it is.</h1><p class="muted">Paste a TikTok or YouTube link and we read the caption for you. For Instagram, add a screenshot. AI finds the shop name, dishes and location tag, then matches a place near ERICA. When it is not sure, it asks you.</p></div>
  <form class="card pad" style="display:flex;flex-direction:column;gap:10px" onsubmit="event.preventDefault();runImport(this.u.value,this.c.value)">
    <label class="small" for="u" style="font-weight:800">Post link (TikTok and YouTube are read automatically)</label>
    <input class="field" id="u" name="u" placeholder="https://vt.tiktok.com/..." value="${esc(r.url||"")}">
    <label class="small" for="shot" style="font-weight:800">Screenshot of the post (best for Instagram)</label>
    <label class="btn block" for="shot" style="border-style:dashed">${ic("camera")}${S.impImg?"Change screenshot":"Add screenshot"}</label>
    <input id="shot" type="file" accept="image/png,image/jpeg,image/webp" class="sr" onchange="pickShot(this.files&&this.files[0])">
    ${S.impImgUrl?`<div class="row"><img src="${S.impImgUrl}" alt="Your screenshot" style="width:72px;height:96px;object-fit:cover;border:2px solid var(--ink);border-radius:10px"><div style="flex:1;min-width:0"><p class="small" style="font-weight:700">Screenshot added</p><button type="button" class="badge b-chinese" style="border:0" onclick="pickShot(null)">Remove</button></div></div>`:""}
    <label class="small" for="c" style="font-weight:800">Caption or text from the post (optional)</label>
    <textarea class="field" id="c" name="c" placeholder="Paste the caption, hashtags or location tag">${esc(r.caption||"")}</textarea>
    <button type="button" class="small" style="align-self:flex-start;border:0;background:none;color:var(--blue);font-weight:800;text-decoration:underline;padding:0" onclick="document.getElementById('c').value=EXAMPLE">Try an example caption</button>
    <button class="btn primary block" ${r.busy?"disabled":""}>${ic("spark")}${r.busy?"Reading the post...":"Find places"}</button>
    <p class="small muted">Instagram and Naver Blog links cannot be read automatically. For them, add a screenshot or paste the caption.</p>
  </form>
  ${S.imp?impResult(S.imp):`<div class="steps">${[["1","Share the post","In TikTok or YouTube tap Share → Copy link and paste it here. For Instagram, take a screenshot."],["2","We find the place","We read the caption or screenshot, and AI matches a place near ERICA."],["3","Let's go","Saved places show on your Saved tab with a Naver Map route."]].map(([n,t,d])=>`<div class="step"><b>${n}</b><div><h3>${t}</h3><p class="small muted">${d}</p></div></div>`).join("")}</div>`}`;
}
function pickShot(f){if(S.impImgUrl){try{URL.revokeObjectURL(S.impImgUrl)}catch(e){}}S.impImg=f||null;S.impImgUrl=f?URL.createObjectURL(f):null;const c=document.getElementById("c"),u=document.getElementById("u");const cv=c?c.value:"",uv=u?u.value:"";if(S.imp&&!S.imp.busy){S.imp={...S.imp,caption:cv,url:uv};}render();const c2=document.getElementById("c"),u2=document.getElementById("u");if(c2)c2.value=cv;if(u2)u2.value=uv;}
function impResult(r){
  if(r.busy)return `<div class="card pad">${[S.impImg?"Reading the screenshot":"Reading caption and hashtags","Looking for shop names and addresses","Matching places near ERICA"].map((t,i)=>`<div class="check"><span class="dot">${i<2?ic("check"):'<i class="spin"></i>'}</span><span style="font-weight:700">${t}</span></div>`).join("")}</div>`;
  if(r.error)return `<div class="card empty" style="border-color:var(--orange)"><h3>${esc(r.error)}</h3>${r.hint?`<p class="small muted">${esc(r.hint)}</p>`:""}</div>`;
  const rows=r.found||[];
  if(!rows.length)return `<div class="card empty"><h3>No place found</h3><p class="small muted">The screenshot or caption has no shop name, dish or street we can match. Try a screenshot where the name or location tag shows.</p></div>`;
  const inList=rows.filter(x=>x.id&&byId(x.id)).length;
  return `${r.note?`<div class="note">${esc(r.note)}</div>`:""}<h2>${rows.length} place${rows.length>1?"s":""} in this post</h2>
  <div class="list">${rows.map((x,i)=>{const p=x.id&&byId(x.id);const sure=p&&x.conf>=70;const outside=!p&&x.outside;return `<div class="card pad" style="display:flex;flex-direction:column;gap:8px;${sure?"":"border-color:var(--orange)"}">
    <div class="row"><span class="num ${sure?"":"gold"}">${i+1}</span><div style="flex:1;min-width:0"><h3>${esc(p?p.name:x.guess)}</h3><p class="small muted">${esc(x.reason||"")}</p></div><span class="badge ${sure?"b-halal":"b-pork"}">${sure?x.conf+"% match":outside?"Not in list yet":"Needs check"}</span></div>
    ${sure?"":`<label class="small" for="pick${i}" style="font-weight:800">Is it one of our places?</label><select class="field" id="pick${i}" onchange="S.imp.found[${i}].id=this.value||null;S.imp.found[${i}].conf=this.value?100:0;render()"><option value="">No, it is not in the list</option>${[...PLACES].sort((a,b)=>(a.m??9999)-(b.m??9999)).map(q=>`<option value="${q.id}" ${q.id===x.id?"selected":""}>${esc(q.name)}${q.ko&&q.ko!==q.name?" · "+esc(q.ko):""}</option>`).join("")}</select>`}
    ${!p?`<a class="btn naver block" href="https://map.naver.com/p/search/${encodeURIComponent(x.guess+" 안산")}" target="_blank" rel="noopener">${ic("nav")}Find "${esc(x.guess)}" in Naver Map</a><p class="small muted">This place is not in the list (more than 1.5 km away, or new), so it cannot be saved here.</p>`:""}
  </div>`;}).join("")}</div>
  ${inList?`<button class="btn orange block" onclick="saveImport()">${ic("bookmark")}Save ${inList} place${inList>1?"s":""}</button>`:""}`;
}
function localMatch(text){const t=text.toLowerCase();const out=[];
  const hints={zaika:["curry","naan","nan","indian","masala","tandoori"],saray:["kebab","doner","lamb box"],rayhon:["shawarma","falafel"],gimbapq:["gimbap"],pizzaschool:["pizza"],mealplanb:["burrito"],tamna:["clam","noodle soup"],thechicken:["boneless","fried chicken"],ilmi:["dakgalbi"],isaac:["toast"],subway:["subway","sandwich"],alchon:["roe"]};
  for(const p of PLACES){let c=0;const ko=(p.ko||"").split(" ")[0];if(t.includes(p.name.toLowerCase())||(ko.length>=2&&t.includes(ko.toLowerCase())))c=95;else if((hints[p.id]||[]).some(h=>t.includes(h)))c=60;if(c)out.push({id:p.id,guess:p.name,conf:c,reason:c>90?"Name found in the caption":"A dish in the caption matches this menu"});}
  return out.slice(0,5);}
async function shrink(file){const bmp=await createImageBitmap(file);const sc=Math.min(1,1280/Math.max(bmp.width,bmp.height));const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);return {type:"image/jpeg",data:c.toDataURL("image/jpeg",0.85).split(",")[1]};}
async function runImport(url,caption){
  url=url.trim();let text=caption.trim();const hasImg=!!S.impImg;let note="";
  if(!text&&!hasImg&&!url){S.imp={url,caption,error:"Add a link, a screenshot or a caption first"};render();return;}
  S.imp={url,caption,busy:true,found:[]};render();
  if(url&&!text){
    try{const o=await api("/api/oembed?url="+encodeURIComponent(url));
      if(o&&o.found){text=[o.title,o.author?"Posted by @"+o.author:""].filter(Boolean).join("\n");note=`Caption read from ${o.source}: "${o.title.slice(0,160)}"`;}
      else if(o&&o.supported===false&&!hasImg){S.imp={url,caption,error:"This link cannot be read automatically",hint:"Instagram and Naver Blog links need a screenshot or the caption. TikTok and YouTube links work by themselves."};render();return;}
    }catch(e){}
  }
  if(!text&&!hasImg){S.imp={url,caption,error:"Could not read this link",hint:"The post may be private or deleted. Add a screenshot or paste the caption."};render();return;}
  try{
    const image=hasImg?await shrink(S.impImg):null;
    const out=await api("/api/ai",{task:"import",url,caption:text,image});
    const arr=Array.isArray(out&&out.places)?out.places:[];
    S.imp={url,caption,note,found:arr.slice(0,6).map(x=>({id:x.id&&byId(String(x.id))?String(x.id):null,guess:String(x.guess||"Unknown place"),conf:Math.max(0,Math.min(100,Number(x.confidence)||0)),outside:!!x.outside,reason:String(x.reason||"")}))};
  }catch(e){
    if(e&&e.code==="ai_not_configured")S.aiOff=true;
    if(e&&e.code==="rate_limited")S.imp={url,caption,error:"Too many requests right now",hint:"Wait a minute, then try again."};
    else if(!text)S.imp={url,caption,error:"AI cannot read screenshots right now",hint:"Paste the caption instead. Simple name matching works without AI."};
    else S.imp={url,caption,note,found:localMatch(url+"\n"+text)};
  }
  render();
}
function saveImport(){const ids=S.imp.found.map(x=>x.id).filter(id=>id&&byId(id));if(!ids.length){toast("Choose a place first");return;}ids.forEach(id=>S.saved.add(id));persistSaved();S.imp=null;pickShot(null);toast(ids.length+" place(s) saved");location.hash="saved";}


// ---------- halal marts (data: marts.json) ----------

// ---------- router ----------
const TABS=[["home","Home","home"],["explore","Explore","compass"],["bot","AI Bot","spark"],["saved","Saved","heart"],["me","Me","user"]];
function route(){return (location.hash||"#home").slice(1)||"home";}
let lastRoute=null;
function render(){
  const r=route();const v=document.getElementById("view");
  const html=r.startsWith("p-")?vPlace(r.slice(2)):r.startsWith("m-")?vMart(r.slice(2)):r==="marts"?vMarts():({home:vHome,explore:vExplore,bot:vBot,saved:vSaved,me:vMe}[r]||vHome)();
  const active=document.activeElement&&document.activeElement.id;const sel=active&&document.activeElement.selectionStart;
  v.innerHTML=html;
  if(active){const el=document.getElementById(active);if(el&&el.tagName==="INPUT"&&r!=="bot"){el.focus();try{el.setSelectionRange(sel,sel)}catch(e){}}}
  const top=r.startsWith("p-")?"explore":(r==="marts"||r.startsWith("m-"))?"home":(["home","explore","bot","saved","me"].includes(r)?r:"home");
  document.getElementById("tabs").innerHTML=TABS.map(([k,l,i])=>k==="bot"?`<a class="tab ai" href="#bot" ${top===k?'aria-current="page"':""}><span class="ic">${ic(i)}</span>${l}</a>`:`<a class="tab" href="#${k}" ${top===k?'aria-current="page"':""}>${ic(i,top===k&&k==="saved")}${l}</a>`).join("");
  if(r==="map"&&S.mapView==="kakao"&&CFG.KAKAO_JS_KEY)initKakao();
  if(r!==lastRoute){lastRoute=r;window.scrollTo(0,0);}
}
function softRender(){const a=document.activeElement;if(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT"))return;render();}
window.addEventListener("hashchange",render);
boot();
